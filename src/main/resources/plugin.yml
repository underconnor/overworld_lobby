name: OverworldLobby
version: '${version}'
main: io.github.underconnor.overworld.lobby.OverworldLobby
api-version: '26.2'
author: underconnor
description: Configurable lobby protection, environment locks and survival flight
website: https://github.com/underconnor/overworld_lobby
softdepend: [LuckPerms, Multiverse-Core, Citizens]
commands:
  setspawn:
    description: 현재 위치·시선 또는 지정 좌표로 기본 로비 스폰을 저장합니다.
    usage: /setspawn [world x y z [yaw] [pitch]]
  lobby:
    description: 로비 비행, 월드별 시간·날씨와 보호 설정을 관리합니다.
    usage: /lobby [fly [on|off]|time <값> [월드]|weather <값> [월드]|setspawn [world x y z [yaw] [pitch]]|border|reload|status]
    aliases: [overworldlobby]
permissions:
  overworld.lobby.admin:
    description: 기본 스폰·월드별 시간·날씨·경계 설정, 설정 다시 불러오기와 상태 조회
    default: op
  overworld.lobby.fly:
    description: 설정에서 비행을 허용한 로비에서 비행하기
    default: true
  overworld.lobby.bypass:
    description: 플레이어 행동·일반 피해·게임 모드·비행 제한 우회. 포화도·허기·낙하 피해·월드 경계 보호와 자동 스폰은 항상 적용
    default: op
    children:
      overworld.lobby.bypass.mode: true
      overworld.lobby.bypass.block-break: true
      overworld.lobby.bypass.block-place: true
      overworld.lobby.bypass.buckets: true
      overworld.lobby.bypass.interact: true
      overworld.lobby.bypass.containers: true
      overworld.lobby.bypass.entity-interact: true
      overworld.lobby.bypass.entity-damage: true
      overworld.lobby.bypass.pvp: true
      overworld.lobby.bypass.item-use: true
      overworld.lobby.bypass.item-drop: true
      overworld.lobby.bypass.item-pickup: true
      overworld.lobby.bypass.vehicles: true
      overworld.lobby.bypass.portals: true
      overworld.lobby.bypass.player-damage: true
  overworld.lobby.bypass.mode:
    description: 게임 모드와 비행 상태 강제 변경 우회
    default: false
  overworld.lobby.bypass.block-break:
    default: false
  overworld.lobby.bypass.block-place:
    default: false
  overworld.lobby.bypass.buckets:
    default: false
  overworld.lobby.bypass.interact:
    default: false
  overworld.lobby.bypass.containers:
    default: false
  overworld.lobby.bypass.entity-interact:
    default: false
  overworld.lobby.bypass.entity-damage:
    default: false
  overworld.lobby.bypass.pvp:
    default: false
  overworld.lobby.bypass.item-use:
    default: false
  overworld.lobby.bypass.item-drop:
    default: false
  overworld.lobby.bypass.item-pickup:
    default: false
  overworld.lobby.bypass.vehicles:
    default: false
  overworld.lobby.bypass.portals:
    default: false
  overworld.lobby.bypass.player-damage:
    default: false
